name: build
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Clone protocol packages
        run: git clone --depth 1 https://github.com/fionadream/dsh-Go.git vendor/dsh-go

      - name: Scaffold Android project
        run: |
          flutter create --org io.github.fionadream --project-name dsh_harness --platforms=android .scaffold
          cp -r .scaffold/android ./android
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          t = p.read_text(encoding='utf-8')
          if 'android.permission.INTERNET' not in t:
              t = t.replace('<application', '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          t = t.replace('android:label="dsh_harness"', 'android:label="DSH R"')
          p.write_text(t, encoding='utf-8')
          print('manifest ok')

          # file_picker 的传递依赖要求 compileSdk >= 36
          for name in ('app/build.gradle.kts', 'app/build.gradle'):
              g = pathlib.Path('android') / name
              if not g.exists():
                  continue
              s = g.read_text(encoding='utf-8')
              s = s.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
              s = s.replace('compileSdkVersion flutter.compileSdkVersion', 'compileSdkVersion 36')
              s = s.replace('compileSdk = 34', 'compileSdk = 36')
              s = s.replace('compileSdkVersion 34', 'compileSdkVersion 36')
              g.write_text(s, encoding='utf-8')
              print('patched compileSdk in', name)
          PY

      - name: Pub get
        run: flutter pub get

      - name: Launcher icons
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-harness-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.${{ github.run_number }}
          name: DSH R v0.2.${{ github.run_number }}
          files: build/app/outputs/flutter-apk/*.apk
