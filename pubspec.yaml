name: dsh_harness
description: Minimal DSH remote client (UI only, protocol reused from dsh-Go)
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.3.1
  file_picker: ^8.1.2
  flutter_foreground_task: ^11.0.3
  image: ^4.5.4
  media_store_plus: ^0.1.3
  open_filex: ^10.2.0
  path_provider: ^2.1.4
  dsh_remote:
    path: vendor/dsh-go/packages/dsh_remote

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png