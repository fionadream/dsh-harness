name: dsh_harness
description: Minimal DSH remote client (UI only, protocol reused from dsh-Go)
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.3.1
  dsh_remote:
    path: vendor/dsh-go/packages/dsh_remote

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true